[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keeperhub-hermes-plugin"
version = "1.0.0"
description = "Hermes Agent plugin wrapping KeeperHub MCP (kh_* tools)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "keeperhub-mcp>=0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."hermes_agent.plugins"]
keeperHub = "keeperhub_plugin.entry:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["keeperhub_plugin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
